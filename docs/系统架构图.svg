<svg viewBox="0 0 680 680" width="100%" role="img" xmlns="http://www.w3.org/2000/svg">
  <title>基于GSCNet的海洋检测平台系统架构图</title>
  <desc>自下而上分为数据存储层、后端服务层、通信层、前端表现层与用户层，展示各层模块与数据流向</desc>
  <style>
    .th{font-family:"Microsoft YaHei",sans-serif;font-size:14px;font-weight:500;fill:#1f2937}
    .ts{font-family:"Microsoft YaHei",sans-serif;font-size:12px;font-weight:400;fill:#4b5563}
    .tk{font-family:"Microsoft YaHei",sans-serif;font-size:12px;font-weight:500;fill:#1f2937}
    .cap{font-family:"Microsoft YaHei",sans-serif;font-size:11px;font-weight:400;fill:#6b7280}
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text class="th" x="340" y="28" text-anchor="middle" dominant-baseline="central" style="font-size:15px">基于 GSCNet 的海洋检测平台 · 系统架构</text>

  <rect x="40" y="44" width="600" height="50" rx="10" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
  <text class="th" x="60" y="62" dominant-baseline="central">用户层（浏览器）</text>
  <text class="ts" x="60" y="80" dominant-baseline="central">上传图片 / 视频 · 查看检测结果与实时画面 · 查询记录与统计</text>

  <path d="M340 94 L340 114" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="352" y="104" dominant-baseline="central">HTTP / WebSocket</text>

  <rect x="40" y="116" width="600" height="82" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text class="th" x="60" y="134" dominant-baseline="central">前端表现层 ｜ 原生 HTML5 · CSS3 · JavaScript · Chart.js</text>
  <rect x="56" y="150" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="tk" x="108" y="167" text-anchor="middle" dominant-baseline="central">首页</text>
  <rect x="172" y="150" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="tk" x="224" y="167" text-anchor="middle" dominant-baseline="central">图片检测</text>
  <rect x="288" y="150" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="tk" x="340" y="167" text-anchor="middle" dominant-baseline="central">视频检测</text>
  <rect x="404" y="150" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="tk" x="456" y="167" text-anchor="middle" dominant-baseline="central">检测记录</text>
  <rect x="520" y="150" width="104" height="34" rx="8" fill="#FFFFFF" stroke="#85B7EB" stroke-width="0.5"/>
  <text class="tk" x="572" y="167" text-anchor="middle" dominant-baseline="central">数据统计</text>

  <path d="M340 198 L340 218" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="220" width="290" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="56" y="238" dominant-baseline="central">HTTP · RESTful API</text>
  <text class="ts" x="56" y="256" dominant-baseline="central">请求-响应 · JSON 数据格式</text>
  <rect x="350" y="220" width="290" height="48" rx="10" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text class="th" x="366" y="238" dominant-baseline="central">WebSocket 长连接</text>
  <text class="ts" x="366" y="256" dominant-baseline="central">视频逐帧实时推送（图像 + 统计）</text>

  <path d="M340 268 L340 286" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="288" width="600" height="232" rx="16" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
  <text class="th" x="60" y="308" dominant-baseline="central">后端服务层 ｜ Python · FastAPI · ASGI（Uvicorn）</text>

  <text class="ts" x="60" y="330" dominant-baseline="central">接口层</text>
  <rect x="56" y="340" width="133" height="32" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="122" y="356" text-anchor="middle" dominant-baseline="central">检测 /detect</text>
  <rect x="201" y="340" width="133" height="32" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="267" y="356" text-anchor="middle" dominant-baseline="central">记录 /records</text>
  <rect x="346" y="340" width="133" height="32" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="412" y="356" text-anchor="middle" dominant-baseline="central">统计 /stats</text>
  <rect x="491" y="340" width="133" height="32" rx="6" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="557" y="356" text-anchor="middle" dominant-baseline="central">模型与配置</text>

  <text class="ts" x="60" y="390" dominant-baseline="central">业务逻辑层</text>
  <rect x="56" y="400" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="145" y="415" text-anchor="middle" dominant-baseline="central">yolo_engine</text>
  <text class="ts" x="145" y="431" text-anchor="middle" dominant-baseline="central">推理引擎 · 类别读取</text>
  <rect x="250" y="400" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="339" y="415" text-anchor="middle" dominant-baseline="central">detection_service</text>
  <text class="ts" x="339" y="431" text-anchor="middle" dominant-baseline="central">图片检测 · 绘框 · 统计</text>
  <rect x="444" y="400" width="178" height="44" rx="8" fill="#FFFFFF" stroke="#AFA9EC" stroke-width="0.5"/>
  <text class="tk" x="533" y="415" text-anchor="middle" dominant-baseline="central">video_task</text>
  <text class="ts" x="533" y="431" text-anchor="middle" dominant-baseline="central">视频逐帧 · 任务管理</text>

  <text class="ts" x="60" y="462" dominant-baseline="central">模型推理</text>
  <rect x="56" y="470" width="568" height="34" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
  <text class="tk" x="340" y="487" text-anchor="middle" dominant-baseline="central">GSCNet 检测权重（YOLO 格式） · Ultralytics + PyTorch · CPU 自动推理</text>

  <path d="M340 520 L340 540" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="542" width="600" height="92" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text class="th" x="60" y="560" dominant-baseline="central">数据存储层</text>
  <text class="ts" x="60" y="582" dominant-baseline="central">SQLite 数据库（WAL）：detections 检测主表 · detection_items 目标明细</text>
  <text class="ts" x="60" y="602" dominant-baseline="central">detection_class_stats 类别统计 · video_frame_stats 逐帧统计</text>
  <text class="ts" x="60" y="622" dominant-baseline="central">文件存储：data/uploads 原始文件 · data/results 检测结果图</text>

  <text class="cap" x="340" y="656" text-anchor="middle" dominant-baseline="central">集中配置 config.yaml ／ 环境变量 ／ 默认值 ｜ 统一异常处理 · 参数化 SQL · 输入校验与转义</text>
</svg>
