# ==========================================================
# 配置覆盖示例
# 使用方式: 复制本文件为 config.yaml, 按需修改后重启服务
# 未列出的配置项沿用 config.py 中的默认值
# 优先级: 环境变量 > config.yaml > 默认值
# ==========================================================

# ---------- 模型 ----------
# 留空则自动使用 models/ 目录下的第一个 .pt 文件
model_path: models/best.pt

# ---------- 推理参数 ----------
conf_threshold: 0.25      # 置信度阈值
iou_threshold: 0.45       # NMS IoU 阈值
imgsz: 640                # 模型输入尺寸
device: auto              # auto / cpu / cuda / 0

# ---------- 视频检测 ----------
frame_skip: 2             # 每 N 帧检测 1 帧, CPU 较慢时可调大(3~5)
video_max_side: 960       # 视频帧长边缩放上限
jpeg_quality: 70          # WebSocket 推流图像质量
push_fps_limit: 20        # 推流帧率上限, 0 为不限

# ---------- 服务 ----------
host: 127.0.0.1
port: 8000
max_upload_mb: 300        # 单文件上传大小上限(MB)

# ---------- 类别显示名映射(可选) ----------
# 类别名始终从模型读取, 这里只做"显示名"翻译, 不配置则显示模型原始名(如 hd/hx/hs/sb/other)
# 下面是按 URPC 常见标注推测的中文对应, 请以你自己 data.yaml 的标注含义为准
# class_name_map:
#   hd: 海胆
#   hx: 海星
#   hs: 海参
#   sb: 扇贝
#   other: 其他

# ================= AI 对话助手(可选, 默认关闭) =================
# 为「接口文档」页提供 AI 答疑浮窗。三条设计约束:
#   1. 默认关闭    —— 关闭时页面上不会出现助手入口, 也不发起任何外部请求
#   2. 密钥不落盘  —— 强烈建议只设环境变量 LLM_API_KEY, 不要写在本文件里
#                     (本模板会入库; 真实配置 config.yaml 已被 .gitignore 排除)
#   3. 失败不影响主流程 —— 助手不可用时只显示提示, 检测/统计等功能照常
#
# 启用步骤:
#   1) 设置环境变量(推荐):
#        Windows 命令行   set LLM_API_KEY=sk-xxxxxxxx
#        PowerShell       $env:LLM_API_KEY="sk-xxxxxxxx"
#   2) 把下面的 llm_enabled 改为 true
#   3) 重启服务, 各页面右下角会出现助手入口
#
# llm_enabled: false                 # 总开关
# llm_api_key: ""                    # 留空则只读环境变量 LLM_API_KEY
# llm_base_url: "https://api.deepseek.com"
# llm_model: "deepseek-flash"        # 当前官方名(= DeepSeek-V4.1-Flash); 另有 deepseek-v4-pro
#                                    # 注意: deepseek-v4-flash 是旧别名, 已废弃; deepseek-chat 已停用
# llm_connect_timeout: 5.0           # 连接超时(秒)
# llm_read_timeout: 60.0             # 读取超时(秒)
# llm_max_concurrency: 2             # 同时进行的对话数上限
# llm_disable_thinking: true         # 关闭思考模式(强烈建议保持 true)
#                                    # 原因: V4.1-Flash 默认思考, 思考token 同样计入输出配额,
#                                    #      实测 300 配额会被思考全部吃光导致答复为空。
#                                    #      参数为 thinking:{"type":"disabled"}; 实测唯一生效的开关
# llm_max_tokens: 4096               # 单次回复最大长度
