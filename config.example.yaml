# ==========================================================
# 配置覆盖示例
# 使用方式: 复制本文件为 config.yaml, 按需修改后重启服务
# 未列出的配置项沿用 config.py 中的默认值
# 优先级: 环境变量 > config.yaml > 默认值
# ==========================================================

# ---------- 模型 ----------
# 留空则自动使用 models/ 目录下的第一个 .pt 文件
model_path: models/best.pt

# ---------- 推理参数 ----------
conf_threshold: 0.25      # 置信度阈值
iou_threshold: 0.45       # NMS IoU 阈值
imgsz: 640                # 模型输入尺寸
device: auto              # auto / cpu / cuda / 0

# ---------- 视频检测 ----------
frame_skip: 2             # 每 N 帧检测 1 帧, CPU 较慢时可调大(3~5)
video_max_side: 960       # 视频帧长边缩放上限
jpeg_quality: 70          # WebSocket 推流图像质量
push_fps_limit: 20        # 推流帧率上限, 0 为不限

# ---------- 服务 ----------
host: 127.0.0.1
port: 8000
max_upload_mb: 300        # 单文件上传大小上限(MB)

# ---------- 类别显示名映射(可选) ----------
# 类别名始终从模型读取, 这里只做"显示名"翻译, 不配置则显示模型原始名(如 hd/hx/hs/sb/other)
# 下面是按 URPC 常见标注推测的中文对应, 请以你自己 data.yaml 的标注含义为准
# class_name_map:
#   hd: 海胆
#   hx: 海星
#   hs: 海参
#   sb: 扇贝
#   other: 其他
